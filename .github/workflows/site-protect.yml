name: xy-site-protect
# Founder-enforced (2026-09-03): NO agent may delete or remove anything from the
# website. Additions and edits are allowed. This guard auto-restores any file
# that gets deleted/renamed, and any HTML edit that removes core footer links or
# protected invariants. Founder-approved permanent removals live in
# .github/site-delete-allowlist.txt and are exempt.
# Two paths: (1) fast check on every push to main; (2) hourly scheduled sweep
# that also catches commits using "[skip ci]" which bypass push triggers.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-protect
  cancel-in-progress: false

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # full history needed by the hourly sweep

      - name: Audit & auto-restore deletions / removals
        run: |
          python3 - <<'PY'
          import os, subprocess, sys

          def sh(*a, check=False):
              r = subprocess.run(a, capture_output=True, text=True)
              if check and r.returncode != 0:
                  raise RuntimeError(r.stderr)
              return r.stdout.strip()

          EVENT = os.environ.get("GITHUB_EVENT_NAME", "push")

          allowed = []
          try:
              with open(".github/site-delete-allowlist.txt", encoding="utf-8") as fh:
                  for raw in fh:
                      p = raw.strip()
                      if p and not p.startswith("#"):
                          allowed.append(p)
          except FileNotFoundError:
              pass

          def is_allowed(path):
              for a in allowed:
                  if a.endswith("/") and path.startswith(a):
                      return True
                  if path == a:
                      return True
              return False

          tokens = [
              'href="about">About</a>', 'href="security">Data Security</a>',
              'href="careers">Careers</a>', 'href="news">News</a>',
              'href="industries">Industries</a>', 'href="contributors">Contributors</a>',
              'href="resources">Resources</a>', 'href="as-seen-on">As Seen On</a>',
              'href="contact">Contact</a>', 'href="terms">Terms &amp; Conditions</a>',
              'href="privacy">Privacy Policy</a>', 'href="cookies">Cookie Policy</a>',
              'href="acceptable-use">Acceptable Use Policy</a>',
          ]

          def count_tokens(text):
              return sum(text.count(t) for t in tokens)

          def last_touch(path):
              return sh("git", "log", "--format=%H", "-1", "--", path)

          restore = set()

          # ---------- PUSH fast path: compare HEAD vs HEAD~1 ----------
          if EVENT == "push":
              prev = sh("git", "rev-parse", "HEAD~1")
              if prev:
                  status = sh("git", "diff", "--name-status", "-M", "HEAD~1", "HEAD").splitlines()
                  for line in status:
                      parts = line.split("\t")
                      if not parts:
                          continue
                      typ = parts[0][0]
                      if typ in ("D", "R"):
                          path = parts[1]
                          if not is_allowed(path):
                              restore.add(path)
                  for line in status:
                      parts = line.split("\t")
                      if parts and parts[0][0] in ("M", "A", "R") and parts[-1].endswith(".html"):
                          f = parts[-1]
                          head = sh("git", "show", "HEAD:" + f)
                          base = sh("git", "show", "HEAD~1:" + f)
                          if head and base and count_tokens(head) < count_tokens(base):
                              restore.add(f)
          # ---------- SCHEDULED/DISPATCH sweep: compare vs last-touch parent ----------
          else:
              tracked = sh("git", "ls-files").splitlines()
              for path in tracked:
                  if is_allowed(path):
                      continue
                  if not os.path.exists(path):
                      restore.add(path)
                      continue
                  if path.endswith(".html"):
                      touch = last_touch(path)
                      if not touch:
                          continue
                      parent = sh("git", "rev-parse", touch + "^")
                      if not parent:
                          continue
                      head = open(path, encoding="utf-8", errors="replace").read()
                      base = sh("git", "show", parent + ":" + path)
                      if base and count_tokens(head) < count_tokens(base):
                          restore.add(path)

          # ---------- founder-forbidden pages stay absent ----------
          forbidden = ["pricing.html", "video-data.html", "contributor-dashboard.html",
                       "assets/contributor-dashboard.js", "assets/supabase-config.js",
                       "assets/contributor-signup.js"]
          removed_forbidden = []
          for f in forbidden:
              if os.path.exists(f):
                  os.remove(f)
                  removed_forbidden.append(f)

          restore = sorted(p for p in restore if p not in forbidden)
          if not restore and not removed_forbidden:
              print("site-guard: OK - nothing to restore")
              sys.exit(0)

          # restore from the commit right before the file's last touch (has content)
          for f in list(restore):
              touch = last_touch(f)
              src = None
              if touch:
                  src = sh("git", "rev-parse", touch + "^")
              if src:
                  try:
                      sh("git", "checkout", src, "--", f, check=True)
                      print("restore", f, "from", src[:7])
                  except Exception as e:
                      print("skip", f, "->", e)
                      restore.discard(f)
              else:
                  restore.discard(f)

          if not sh("git", "status", "--porcelain").strip():
              print("site-guard: OK (no changes needed)")
              sys.exit(0)

          sh("git", "config", "user.name", "XYNTRIQ Site Guard", check=True)
          sh("git", "config", "user.email", "guard@xyntriq.in", check=True)
          sh("git", "add", "-A", check=True)
          sh("git", "commit", "-m", "Site Guard: auto-restored removed content [skip ci]", check=True)
          push = subprocess.run(["git", "push", "origin", "main"], capture_output=True, text=True)
          if push.returncode != 0:
              print("site-guard: WARNING restore commit could not be pushed:")
              print(push.stderr)
              sys.exit(0)
          print("site-guard: RESTORED -> " + ", ".join(restore + removed_forbidden))
          PY
